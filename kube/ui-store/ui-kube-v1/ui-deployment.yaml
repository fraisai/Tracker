apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-ui-deployment
  namespace: trackr-namespace
  labels:
    app: eks-ui-store
    tier: frontend
    track: stable
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: eks-ui-store
      tier: frontend
      track: stable
  template:
    metadata:
      labels:
        app: eks-ui-store
        tier: frontend
        track: stable
    spec:
      containers:
        - name: ui-store
          image: 403188442647.dkr.ecr.us-east-2.amazonaws.com/ui-store:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
