apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: trackr-namespace
  labels:
    app: mysql
    app.kubernetes.io/name: mysql
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-read
  namespace: trackr-namespace
  labels:
    app: mysql
    app.kubernetes.io/name: mysql
    readonly: "true"
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
